protocol bgp flapalerted {
    local as OWNAS;
    advertise hostname on;
    
    neighbor fdb5:4236:a579::5 as OWNAS  port 1790;
    direct;
    
    ipv4 {
        add paths on;
        export all;
        import none;
        extended next hop on;
    };

    ipv6 {
        add paths on;
        export all;
        import none;
    };

}
