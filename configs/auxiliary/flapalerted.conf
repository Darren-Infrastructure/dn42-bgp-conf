protocol bgp flapalerted {
    local as OWNAS;
    hostname yes;
    
    neighbor fdc9:e79b:6a88::a003 as OWNAS  port 1790;
    direct;
    
    ipv4 {
        add paths on;
        export all;
        import none;
        extended next hop on;
    };

    ipv6 {
        add paths on;
        export all;
        import none;
    };

}
