template bgp ibgp_n3n {
    local as OWNAS;
    path metric on;

    ipv6 {
        import filter import_v6;
        next hop self;
        export filter export_v6;
        import limit 9000 action block;
    };

    ipv4 {
        extended next hop;
        next hop self;
        import filter import_v4;
        export filter export_v4;
        import limit 9000 action block;
    };
}

filter export_babel {
    if proto != "babel_exports" then reject;
    accept;
}

template babel ibgp_babel {
    interface "proseka" {
        type wired;
    };

    export none;
    import all;
}

include "../../peers/ibgp/*.conf";
