ipv6 table tailscale_igp;

protocol kernel tailscale_igp {
    kernel table 52;
    learn;

    ipv6 {
        table tailscale_igp;
        import all;
        export none;
    };
}

template bgp ibgp {
    local as OWNAS;
    path metric on;

    ipv6 {
        import filter import_v6;
        export filter export_v6;
        import limit 9000 action block;
    };

    ipv4 {
        igp table tailscale_igp;
        extended next hop;
        import filter import_v4;
        export filter export_v4;
        import limit 9000 action block;
    };
}

include "../../peers/ibgp/*.conf";