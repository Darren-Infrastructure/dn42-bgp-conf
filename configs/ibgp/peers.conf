ipv6 table tailscale_igp_table;

protocol kernel tailscale_igp {
    kernel table 52;
    learn;

    ipv6 {
        table tailscale_igp_table;
        import filter {
           if net.len = 128 then { onlink = true; gw = net.ip; }
             accept;
        };
        export none;
    };
}

template bgp ibgp_ts {
    local as OWNAS;
    path metric on;

    ipv6 {
        igp table tailscale_igp_table;
        next hop self;
        import filter import_v6;
        export filter export_v6;
        import limit 9000 action block;
    };

    ipv4 {
        igp table tailscale_igp_table;
        next hop self;
        extended next hop;
        import filter import_v4;
        export filter export_v4;
        import limit 9000 action block;
    };
}

include "../../peers/ibgp/*.conf";