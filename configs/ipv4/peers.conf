# This is a minimal configuration file, which allows the bird daemon to start
# but will not cause anything else to happen.
#
# Please refer to the documentation in the bird-doc package or BIRD User's
# Guide on http://bird.network.cz/ for more information on configuring BIRD and
# adding routing protocols.

# Change this into your BIRD router ID. It's a world-wide unique identification
# of your router, usually one of router's IPv6 addresses.
#router id 198.51.100.1;

# The Kernel protocol is not a real routing protocol. Instead of communicating
# with other routers in the network, it performs synchronization of BIRD's
# routing tables with the OS kernel.
#protocol kernel {
#	scan time 60;
#	import none;
#	export all;   # Actually insert routes into the kernel routing table
#}

# The Device protocol is not a real routing protocol. It doesn't generate any
# routes and it only serves as a module for getting information about network
# interfaces from the kernel. 
include "./configs/ipv4/vars.conf";
include "./configs/ipv4/routes.conf";

function is_self_net() -> bool {
  return net ~ OWNNETSET;
}

function is_valid_network() -> bool {
  return net ~ [
    172.20.0.0/14{21,29}, # dn42
    172.20.0.0/24{28,32}, # dn42 Anycast
    172.21.0.0/24{28,32}, # dn42 Anycast
    172.22.0.0/24{28,32}, # dn42 Anycast
    172.23.0.0/24{28,32}, # dn42 Anycast
    172.31.0.0/16+,       # ChaosVPN
    10.100.0.0/14+,       # ChaosVPN
    10.127.0.0/16+,       # neonetwork
    10.0.0.0/8{15,24}     # Freifunk.net
  ];
}


roa4 table dn42_roa_v4;

protocol static dn42_roa_v4_proto {
    roa4 { table dn42_roa_v4; };
    include "./roa/dn42_v4.conf";
};

protocol kernel export_learned_v4 {
    scan time 20;

    ipv4 {
        import none;
        export filter {
            if source = RTS_STATIC then reject;
            krt_prefsrc = OWNIP;
            accept;
        };
    };
};

filter reject_self {
    if net ~ OWNNETSET then reject;
    accept;
}

protocol static import_v4_from_peers {
    #if net ~ OWNNETSET then reject;

    ipv4 {
        import filter reject_self;
        export none;
    };
}

filter import_v4 {
          add_proto_communities(proto);
          if is_valid_network() && !is_self_net() then {
            if (roa_check(dn42_roa_v4, net, bgp_path.last) != ROA_VALID) then {
              # Reject when unknown or invalid according to ROA
              print "[dn42] ROA check failed for ", net, " ASN ", bgp_path.last;
              reject;
            } else accept;
          } else reject;
        };

filter export_v4 {
             if !is_valid_network() then reject;

             if source = RTS_STATIC then {
                 bgp_community.add(region);
                 bgp_community.add(country);
                 accept;
             }

             if source = RTS_BGP then {
                 accept;
             }

             reject;
        };

template bgp dnpeers_v4 {
    local as OWNAS;
    path metric on;

    ipv4 {   
        import filter import_v4;
        export filter export_v4;
        import limit 9000 action block; 
    };
}

include "./peers/ipv4/*.conf";
