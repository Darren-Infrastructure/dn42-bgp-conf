include "./vars.conf";
include "./routes.conf";
function is_self_net_v6()  {
  return net ~ OWNNETSETv6;
}


function is_valid_network_v6()  {
  return net ~ [
    fd00::/8{44,64} # ULA address space as per RFC 4193
  ];
}

roa6 table dn42_roa_v6;

protocol static dn42_roa_v6_proto {
    roa6 { table dn42_roa_v6; };
    include "../../roa/dn42_v6.conf";
};

protocol kernel export_learned_v6 {
    scan time 20;

    ipv6 {
        import none;
        export filter {
            if source = RTS_STATIC then reject;
            krt_prefsrc = OWNIPv6;
            accept;
        };
    };
};

filter import_v6 {
          add_proto_communities(proto);
          if is_valid_network_v6() && !is_self_net_v6() then {
            if (roa_check(dn42_roa_v6, net, bgp_path.last) != ROA_VALID) then {
              # Reject when unknown or invalid according to ROA
              print "[dn42] ROA check failed for ", net, " ASN ", bgp_path.last;
              reject;
            } else accept;
          } else reject;
        };

filter export_v6 {
             if !is_valid_network_v6() then reject;

             if source = RTS_STATIC then {
                 bgp_community.add(region);
                 bgp_community.add(country);
                 accept;
             }

             if source = RTS_BGP then {
                 accept;
             }

             reject;
        };

template bgp dnpeers_v6 {
    local as OWNAS;
    path metric on;
    advertise hostname on;

    ipv6 {   
        import filter import_v6;
        export filter export_v6;
        import limit 9000 action block;
    };
}

include "../../peers/ipv6/*.conf";
