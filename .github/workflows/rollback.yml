# This is a basic workflow to help you get started with Actions

name: Rollback Backup

# Controls when the workflow will run
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  backup-rollback:
    # The type of runner that the job will run on
    runs-on: ${{ inputs.target }}
    environment: 
       name: ${{ inputs.target }}
       deployment: false
    name: Rolling back to backup

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      # Runs a single command using the runners shell
      - name: Delete Bad Config
        run: |
          rm -rf /etc/bird/* || {
              echo "::error title=Failed to delete bad config:: Check Logs"
              exit 1
            }
          echo "::notice title=Delete success ::Bad config rollback ready"
      - name: Rolling back to backup
        run: |
          cp -a /tmp/bird-back/* /etc/bird || {
              echo "::error title=Failed to rollback bad config:: Check Logs"
              exit 1
            }
          echo "::notice title=Rollback bad config success ::Awaiting configure after ownership fix"
      - name: Fix ownership after rollback
        run: |
          chown -R bird /etc/bird || {
              echo "::error title=Failed to fix ownership:: Check Logs"
              exit 1
            }
          echo "::notice title=Ownership fix success ::Configuring next"
      - name: Applying Rollback Config
        run: |
          result=$(birdc configure 2>&1) || {
              echo "::error title=Failed to configure:: $result"
              exit 1
            }
          echo "$result"
          echo "::notice title=Bad config rollback success :: $result"
