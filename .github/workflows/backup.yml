# This is a basic workflow to help you get started with Actions

name: Backup

# Controls when the workflow will run
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
    outputs:
      status:
         description: "Job Status"
         value: ${{ jobs.backup.result }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  backup:
    # The type of runner that the job will run on
    runs-on: ${{ inputs.target }}
    environment: ${{ inputs.target }}
    name: Backing Up Configs

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      # Runs a single command using the runners shell
      - name: Delete old backup
        run: |
          rm -rf /tmp/bird-back
          
      - name: Creating backup directory
        run: | 
          mkdir -p /tmp/bird-back || {
              echo "::error title=Failed to create backup dir:: Check Logs"
              exit 1
            }
          echo "::notice title=Backup Dir Creation Success ::Backup dir created"
      - name: Copy to backup
        run: |
          cp -r /etc/bird/* /tmp/bird-back || {
              echo "::error title=Backup failure ::Failed to copy to backup"
              exit 1
            }
          echo "::notice title=Backup Creation Success ::Configs copied to backup"
