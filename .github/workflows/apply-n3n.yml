# This is a basic workflow to help you get started with Actions

name: Deploy N3N to Prod

# Controls when the workflow will run
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  deploy-n3n-config:
    # The type of runner that the job will run on
    runs-on: ${{ inputs.target }}
    environment: 
      name: ${{ inputs.target }}
    name: Copying config to target
    env:
      TARGET: ${{ inputs.target }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      # Runs a single command using the runners shell
      - name: Deploying config
        run: |
         export strip_sites=$(bash "$GITHUB_WORKSPACE/bin/strip-sites.sh" "$TARGET") || {
              echo "::error title=Failed to determine node name:: Check Logs"
              exit 1
            }
         export full_conf=$(cat $GITHUB_WORKSPACE/n3n/$strip_sites.conf && echo ' ' && cat $GITHUB_WORKSPACE/n3n/base.conf)  || {
              echo "::error title=Failed to piece together config for $TARGET:: Check Logs"
              exit 1
            }
         printf '%s\n' "$full_conf" > /etc/n3n/proseka.conf  || {
              echo "::error title=Failed to copy config to dir:: Check Logs"
              exit 1
            }
         echo "::notice title=n3n config deployed ::Deployed config $TARGET"
  
  populate-config:
    runs-on: ${{ inputs.target }}
    environment: 
      name: ${{ inputs.target }}
    name: Populating the config
    needs: deploy-n3n-config
    env:
      SUPERNODE: ${{ vars.n3n_supernode }}
      KEY: ${{ secrets.N3N_COMM_KEY }}

    steps:
      - name: Adding supernode and secrets
        run: |
            if ! python3 - <<'PY'
            import os
            from pathlib import Path
      
            p = Path("/etc/n3n/proseka.conf")
            s = p.read_text()
            s = s.replace("REPLACESUPERNODE", os.environ["SUPERNODE"])
            s = s.replace("REPLACEKEY", os.environ["KEY"])
            p.write_text(s)
            PY
            then
              echo "::error title=Failed to fill in secrets::Check Logs"
              exit 1
            fi
            echo "::notice title=n3n config placeholder filled in ::Ready to deploy"
      - name: Copying the script needed
        run: |
         cp $GITHUB_WORKSPACE/bin/proseka-conf.sh /usr/bin/proseka-conf  || {
              echo "::error title=Failed to copy configuration binary to dir:: Check Logs"
              exit 1
            }
         chmod +x /usr/bin/proseka-conf || {
              echo "::error title=Failed to make configuration binary executable:: Check Logs"
              exit 1
            }
         echo "::notice title=Copied all needed binaries ::Ready to deploy"
        
  apply-config:
    # The type of runner that the job will run on
    runs-on: ${{ inputs.target }}
    environment: 
      name: ${{ inputs.target }}
    name: Applying Config
    needs: populate-config

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Copying service file to the systemd dir
        run: |
          cp $GITHUB_WORKSPACE/services/proseka-n3n.service /etc/systemd/system || {
              echo "::error title=Failed to copy service file:: Check Logs"
              exit 1
            }
          echo "::notice title=Copied needed services to /etc/systemd/system ::Ready to deploy"

      - name: Reloading Systemd Daemon
        run: |
          systemctl daemon-reload || {
              echo "::error title=Failed to reload systemd daemon:: Check Logs"
              exit 1
            }
          echo "::notice title=Reloaded systemd ::Ready to deploy"
      
      - name: Setting up service
        run: | 
          systemctl enable proseka-n3n || {
              echo "::error title=Failed to enable services for n3n:: Check Logs"
              exit 1
            }
          echo "::notice title=Enabled systemd services for n3n ::Ready to deploy"

      - name: Running it
        run: |
          systemctl restart proseka-n3n || {
              echo "::error title=Failed to start n3n service:: Check Logs"
              exit 1
            }
          export proseka_ipv4=$(cat /etc/n3n/proseka.conf  | grep address= | awk -F "=" '{print $2 }')
          export proseka_ipv6_last_octet=$(echo $proseka_ipv4 | awk -F "." '{print $4 }' | xargs printf 'a%03x\n')
          export proseka_full_ipv6=fdc9:e79b:6a88::${proseka_ipv6_last_octet} 
          echo "::notice title=Started n3n services ::Deploy done %0A  %0A 🌐 Connection Details %0A Ipv4: $proseka_ipv4 %0A Ipv6: $proseka_full_ipv6"
