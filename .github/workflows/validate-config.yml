# This is a basic workflow to help you get started with Actions

name: Validating Config

# Controls when the workflow will run
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      test: 
        required: true
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  pre-validate:
      name: Pre-validation conditioning
      environment: ${{ inputs.target }}
      runs-on: ${{ inputs.target }}
      env:
        TARGET: ${{ inputs.target }}

      steps:
        - name: Copy vars file to the correct place
          run: |
            cp /etc/bird/asn-num.conf $GITHUB_WORKSPACE || {
              echo "::error title=Workflow suplementation failure ::Failed to copy asn number" 
              exit 1
            }
            cp /etc/bird/bird-vars.conf $GITHUB_WORKSPACE || {
              echo "::error title=Workflow suplementation failure ::Failed to copy bird vars"
              exit 1
            }
            cp /etc/bird/region.conf $GITHUB_WORKSPACE || {
              echo "::error title=Workflow suplementation failure ::Failed to region config"
              exit 1
            }
            cp /etc/bird/configs/ipv4/vars.conf $GITHUB_WORKSPACE/configs/ipv4 || {
              echo "::error title=Workflow suplementation failure ::Failed to copy ipv4 config"
              exit 1
            }
            cp /etc/bird/configs/ipv6/vars.conf $GITHUB_WORKSPACE/configs/ipv6 || {
              echo "::error title=Workflow suplementation failure ::Failed to copy ipv6 config"
              exit 1
            }
            cp /etc/bird/peers/proto_comms.conf $GITHUB_WORKSPACE/peers || {
              echo "::error title=Workflow suplementation failure ::Failed to copy protocol comms"
              exit 1
            }
            echo "::notice title=Workflow suplemented ::All needed variable files has been copied"
            
        - name: Copy ROA files to the correct place
          run: |
            cp -r /etc/bird/roa/* $GITHUB_WORKSPACE/roa || {
              echo "::error title=Workflow suplementation failure ::Failed to copy ROA files for validation"
              exit 1
            }
            echo "::notice title=Workflow suplemented ::All ROA files has been copied"

        - name: Remove self ibgp file
          run: |
            export strip_sites=$(bash "$GITHUB_WORKSPACE/bin/strip-sites.sh" "$TARGET") || {
              echo "::error title=Workflow suplementation failure ::Failed to determine node name"
              exit 1
            }
            rm -f $GITHUB_WORKSPACE/peers/ibgp/${strip_sites}_ibgp.conf || {
              echo "::error title=Workflow suplementation failure ::Failed to remove self IBGP file"
              exit 1
            }
            echo "::notice title=IBGP Error Prevention ::Removing self IBGP to prevent loop"

        - name: Copy self babel file
          run: |
            export strip_sites=$(bash "$GITHUB_WORKSPACE/bin/strip-sites.sh" "$TARGET") || {
              echo "::error title=Workflow suplementation failure ::Failed to determine node name"
              exit 1
            }
            cp $GITHUB_WORKSPACE/babel-configs/${strip_sites}_babel.conf $GITHUB_WORKSPACE/peers/ibgp/ || {
              echo "::error title=Workflow suplementation failure ::Failed to copy the correct babel config"
              exit 1
            }
            echo "::notice title=Babel file copied ::Enrolling node in babel network with identity $TARGET"
      
  validate-config:
    # The type of runner that the job will run on
    runs-on: ${{ inputs.target }}
    environment: ${{ inputs.target }}
    name: Validating Config
    needs: pre-validate

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:   
      - name: Validating Config
        run: |
          cd $GITHUB_WORKSPACE
          result=$(bird -c $GITHUB_WORKSPACE/bird.conf -p 2>&1) || {
              echo "::error title=Validation Error ::Config failed validation %0A $result"
              exit 1
            }
          echo "$result"
          echo "::notice title=Config Successfuly Validated :: $result"
