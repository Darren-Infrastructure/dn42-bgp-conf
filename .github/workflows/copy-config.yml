# This is a basic workflow to help you get started with Actions

name: Deploy Config to Prod

# Controls when the workflow will run
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  deploy:
    # The type of runner that the job will run on
    runs-on: ${{ inputs.target }}
    environment: ${{ inputs.target }}
    name: Copying config to target
    env:
      TARGET: ${{ inputs.target }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      # Runs a single command using the runners shell
      - name: Deploying config
        run: |
         cp -r $GITHUB_WORKSPACE/* /etc/bird || {
              echo "::error title=Failed to copy config over:: Check Logs"
              exit 1
            }
          echo "::notice title=Config copied over ::Removing bootstrap files next"

      - name: Remove bootstrap files
        run: |
          rm -rf /etc/bird/n3n || {
              echo "::error title=Failed to remove n3n files:: Check Logs"
              exit 1
            }
          rm -rf /etc/bird/bin  || {
              echo "::error title=Failed to remove binaries files:: Check Logs"
              exit 1
            }
          rm -rf /etc/bird/services  || {
              echo "::error title=Failed to remove services files:: Check Logs"
              exit 1
            }
          rm -rf /etc/bird/babel-configs  || {
              echo "::error title=Failed to remove babel configs:: Check Logs"
              exit 1
            }
          echo "::notice title=Removed bootstrap files ::Ready to apply"
          
  apply-config:
    # The type of runner that the job will run on
    runs-on: ${{ inputs.target }}
    environment: ${{ inputs.target }}
    name: Applying Config
    needs: deploy

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      
      - name: Applying Config
        run: |
          result = $(birdc configure 2>&1)  || {
              echo "::error title=Failed to apply bird configuration:: $result"
              exit 1
            }
          echo "::notice title=Applied bird configuration :: $result"
