# This is a basic workflow to help you get started with Actions

name: Starter

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  call-deploy:
    strategy:
      fail-fast: false
      matrix:
        target-runners: ${{ fromJSON(vars.BGP_SERVERS) }}
        
    uses: Codex-/return-dispatch@v4.0.1
    with:
      # GitHub Personal Access Token for making API requests.
      token: ${{ github.token }}
      # The git reference for the workflow. The reference can be a branch or tag name.
      ref: ${{ github.repository }}
      # Repository of the action to dispatch.
      repo: ${{ github.repository }}
      # Owner of the given repository.
      owner: ${{ github.repository }}
      # Workflow to return an ID for. Can be the ID or the workflow filename.
      workflow: "test"
      # A flat JSON object, only supports strings, numbers, and booleans (as per workflow inputs API).
      workflow_inputs: "{target: ${{ matrix.target-runners }}}"

