# This is a basic workflow to help you get started with Actions

name: Deploy

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  checkout:
   name: Checkout
   environment: bgp-prod
   strategy:
      matrix:
        target-runners: ${{ fromJSON(vars.BGP_SERVERS) }}

   runs-on: [self-hosted, "${{ matrix.target-runners }}"]
   
   steps:
       - name: Checking out the repo
         uses: actions/checkout@v4
  backup:
    strategy:
      matrix:
        target-runners: ${{ fromJSON(vars.BGP_SERVERS) }}
        
    needs: checkout
    name: Backup
    uses: Darren-Infrastructure/dn42-bgp-conf/.github/workflows/backup.yml@main

    with:
      target: ${{ matrix.target-runners }}

  validate-config:
    strategy:
      matrix:
        target-runners: ${{ fromJSON(vars.BGP_SERVERS) }}
        
    needs: backup
    name: Validate Config
    uses: Darren-Infrastructure/dn42-bgp-conf/.github/workflows/validate-config.yml@main

    with:
      target: ${{ matrix.target-runners }}

  backup-delete:
    strategy:
      matrix:
        target-runners: ${{ fromJSON(vars.BGP_SERVERS) }}
        
    needs: validate-config
    if: failure()
    uses: Darren-Infrastructure/dn42-bgp-conf/.github/workflows/backup-delete.yml@main

    with:
      target: ${{ matrix.target-runners }}
  
  deploy:
    strategy:
      matrix:
        target-runners: ${{ fromJSON(vars.BGP_SERVERS) }}
        
    needs: validate-config
    if: success()
    name: Deploy
    uses: Darren-Infrastructure/dn42-bgp-conf/.github/workflows/copy-config.yml@main

    with:
      target: ${{ matrix.target-runners }}
  
  backup-delete-after-deploy:
    strategy:
      matrix:
        target-runners: ${{ fromJSON(vars.BGP_SERVERS) }}
        
    needs: deploy
    if: success()
    uses: Darren-Infrastructure/dn42-bgp-conf/.github/workflows/backup-delete.yml@main

    with:
      target: ${{ matrix.target-runners }}
