# This is a basic workflow to help you get started with Actions

name: Deploy (haruka-nest)

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  checkout:
   name: Checkout
   environment: ${{ vars.haruka_nest }}

   runs-on: [self-hosted, "${{ vars.haruka_nest }}"]
   
   steps:
       - name: Checking out the repo
         uses: actions/checkout@v4
         with:
            clean: true
  backup:   
    needs: checkout
    name: Backup
    uses: Darren-Infrastructure/dn42-bgp-conf/.github/workflows/backup.yml@main

    with:
      target: ${{ vars.haruka_nest }}

  validate-config:    
    needs: backup
    if: ${{always() && needs.backup.result == 'success'}}
    name: Validate Config
    uses: Darren-Infrastructure/dn42-bgp-conf/.github/workflows/validate-config.yml@main

    with:
      target: ${{ vars.haruka_nest }}
      test: ${{ toJson(needs.backup.outputs) }}

  backup-delete:
    name: Delete backup after failed pre-apply validation
        
    needs: validate-config
    if: ${{always() && needs.validate-config.result == 'failure'}}
    uses: Darren-Infrastructure/dn42-bgp-conf/.github/workflows/backup-delete.yml@main

    with:
      target: ${{ vars.haruka_nest }}
  
  deploy:        
    needs: validate-config
    
    if: ${{always() && needs.validate-config.result == 'success'}}
    name: Deploy
    uses: Darren-Infrastructure/dn42-bgp-conf/.github/workflows/copy-config.yml@main

    with:
      target: ${{ vars.haruka_nest }}
  
  backup-delete-after-deploy:
    name: Delete backup after successfull deploy
        
    needs: deploy
    if: ${{always() && needs.deploy.result == 'success'}}
    uses: Darren-Infrastructure/dn42-bgp-conf/.github/workflows/backup-delete.yml@main

    with:
      target: ${{ vars.haruka_nest }}

  rollback-after-deploy-fail:
    name: Rollback after unsuccessfull deploy
        
    needs: deploy
    if: ${{always() && needs.deploy.result == 'failure'}}
    uses: Darren-Infrastructure/dn42-bgp-conf/.github/workflows/rollback.yml@main

    with:
      target: ${{ vars.haruka_nest }}

  backup-delete-after-rollback:
    if: ${{always() && needs.rollback-after-deploy-fail.result == 'success'}}
    name: Delete backup after rollback
        
    needs: rollback-after-deploy-fail
    uses: Darren-Infrastructure/dn42-bgp-conf/.github/workflows/backup-delete.yml@main

    with:
      target: ${{ vars.haruka_nest }}
